<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img">
  <title>Ink yin-yang</title>
  <defs>
    <filter id="yy-rough" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="yy-clip"><circle cx="200" cy="200" r="180"/></clipPath>
  </defs>
  <g filter="url(#yy-rough)" clip-path="url(#yy-clip)">
    <rect x="20" y="20" width="360" height="360" fill="var(--yy-light, #FFF9EC)"/>
    <path d="M200 20 A180 180 0 0 0 200 380 A90 90 0 0 1 200 200 A90 90 0 0 0 200 20 Z" fill="var(--yy-dark, #2F2714)"/>
    <circle cx="200" cy="110" r="20" fill="var(--yy-light, #FFF9EC)"/>
    <circle cx="200" cy="290" r="20" fill="var(--yy-dark, #2F2714)"/>
  </g>
  <circle cx="200" cy="200" r="180" fill="none" stroke="var(--yy-line, #7A4E12)" stroke-width="2" opacity=".3"/>
</svg>
