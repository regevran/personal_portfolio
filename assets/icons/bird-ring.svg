<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 7 28 50" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="ring-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FCFDFE"/>
      <stop offset="0.2" stop-color="#D9DDE1"/>
      <stop offset="0.5" stop-color="#8A9299"/>
      <stop offset="0.8" stop-color="#E9EDF0"/>
      <stop offset="1" stop-color="#AEB6BD"/>
    </linearGradient>
    <mask id="ring-opening">
      <rect x="18" y="7" width="28" height="50" fill="#fff"/>
      <rect x="37.4" y="7" width="3.2" height="50" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#ring-opening)">
    <!-- one tall, narrow band, opened down one side -->
    <path d="M20 9.5
             C26 8.6 38 8.6 44 9.5
             L44 54.5
             C38 55.4 26 55.4 20 54.5
             Z"
          fill="url(#ring-metal)" stroke="#4A5258" stroke-width="1.4"/>

    <!-- rolled back rims -->
    <path d="M20.7 10.7
             C26.3 9.9 37.7 9.9 43.3 10.7"
          fill="none" stroke="#F7F9FA" stroke-width="1.2" opacity="0.9"/>
    <path d="M20.7 53.3
             C26.3 54.1 37.7 54.1 43.3 53.3"
          fill="none" stroke="#D4DADE" stroke-width="1" opacity="0.7"/>

    <!-- the front edge of the band, which gives it its depth -->
    <path d="M20.9 12.2
             C26.5 14.4 37.5 14.4 43.1 12.2"
          fill="none" stroke="#8A9299" stroke-width="0.7" opacity="0.55"/>
    <path d="M20.9 51.8
             C26.5 49.6 37.5 49.6 43.1 51.8"
          fill="none" stroke="#6C747A" stroke-width="0.7" opacity="0.4"/>

    <!-- stamping on the band -->
    <g fill="#4F575D" opacity="0.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
       font-size="3.3" letter-spacing="0.12">
      <text x="29" y="33.8" text-anchor="middle">IL 4821</text>
    </g>
  </g>

  <!-- the cut: a dark inner face on one side, a bright edge on the other -->
  <path d="M37.2 10V54" stroke="#596168" stroke-width="1.1" opacity="0.7"/>
  <path d="M40.9 10V54" stroke="#FCFDFE" stroke-width="0.8" opacity="0.8"/>
</svg>
